[package]
name = "ado-lens"
version = "1.0.0"
description = "Azure DevOps Variable Group Comparison Tool"
authors = ["ADO Lens"]
edition = "2021"

[lib]
name = "ado_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Official Microsoft Rust SDK for Azure DevOps – mirrors the Node.js SDK
# auth format (Credential::from_pat) and provides typed models.
azure_devops_rust_api = { version = "0.34", features = ["core", "distributed_task"] }

keyring = { version = "3", features = [] }
tokio = { version = "1", features = ["rt"] }

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
