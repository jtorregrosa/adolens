[package]
name = "ADOLens"
version = "1.0.0"
description = "Azure DevOps Variable Group Comparison Tool"
authors = ["OBS Team Archery"]
edition = "2021"

[lib]
name = "ado_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Official Microsoft Rust SDK for Azure DevOps – mirrors the Node.js SDK
# auth format (Credential::from_pat) and provides typed models.
azure_devops_rust_api = { version = "0.34", features = ["core", "distributed_task"] }

reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
futures-util = "0.3"
base64 = "0.22"

# Use platform credential stores so "remember me" persists across restarts.
# Without these, keyring uses a mock store and credentials are lost when the app closes.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tokio = { version = "1", features = ["rt"] }

# Jaro-Winkler similarity for fuzzy project name matching (typos, casing).
strsim = "0.11"

[profile.release]
# Optimize for size (use "s" for speed/size balance, "z" for smallest binary)
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
